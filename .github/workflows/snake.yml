name: Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#7c4dcc&color_dots=#ebedf0,#e4d4fb,#c9a8f5,#a77bea,#7c4dcc
            dist/snake-dark.svg?palette=github-dark&color_snake=#bb9af7&color_dots=#161b22,#2d2440,#4c3a75,#7d5bbf,#bb9af7

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
